# Publishes the personal browser-only app. Records stay in the browser; no backend is deployed.
# VITE_PERSONAL=1 starts with an empty profile and disables simulated demo coaching.
name: Deploy personal openGym to GitHub Pages

on:
  push:
    branches: [codex/personal-pages]
    paths:
      - 'frontend/**'
      - 'catalogue/**'
      - 'scripts/catalogue/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- src/store/useStore.personal.test.jsx
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_PERSONAL: '1'
      # The original 180 px exercise media, served from the Pages site
      - run: node scripts/catalogue/stage-media.mjs frontend/dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
